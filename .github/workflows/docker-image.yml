name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: ["main"]
    paths:
      - "apps/**"
    # Publish semver tags as releases.
    tags: ["v*.*.*"]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed apps
        id: changes
        run: |
          # Get list of all apps
          APPS=("personal-blog" "work-rate-calculator" "chris-coombs-blog")
          CHANGED_APPS=()

          # Check if any files in each app directory have changed
          for app in "${APPS[@]}"; do
            if git diff --name-only HEAD~1 | grep -q "^apps/$app/"; then
              CHANGED_APPS+=("$app")
            fi
          done

          # If no specific apps changed but apps/** triggered, build all
          if [ ${#CHANGED_APPS[@]} -eq 0 ]; then
            CHANGED_APPS=("${APPS[@]}")
          fi

          # Create JSON array for matrix
          JSON_ARRAY=$(printf '%s\n' "${CHANGED_APPS[@]}" | jq -R . | jq -s -c .)
          echo "matrix={\"app\":$JSON_ARRAY}" >> $GITHUB_OUTPUT

  build:
    environment: production
    needs: detect-changes
    runs-on: self-hosted
    if: needs.detect-changes.outputs.matrix != '{"app":[]}'

    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      # TEMPORARILY DISABLED: Rate limiting issues with GitHub releases
      # - name: Install cosign
      #   if: github.event_name != 'pull_request'
      #   uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
      #   with:
      #     cosign-release: "v2.2.4"

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0
        with:
          platforms: linux/amd64,linux/arm64

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Get app-specific version number
      - name: Get app version
        id: version
        run: |
          # Create versions directory if it doesn't exist
          mkdir -p .github/versions

          # Read current version for this app, default to 0
          VERSION_FILE=".github/versions/${{ matrix.app }}.version"
          if [ -f "$VERSION_FILE" ]; then
            CURRENT_VERSION=$(cat "$VERSION_FILE")
          else
            CURRENT_VERSION=0
          fi

          # Increment version
          NEW_VERSION=$((CURRENT_VERSION + 1))
          echo "$NEW_VERSION" > "$VERSION_FILE"

          # Output version for use in tags
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Commit the version file
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add "$VERSION_FILE"
          git commit -m "Bump version for ${{ matrix.app }} to v1.0.$NEW_VERSION" || true
          git push || true

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.app }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: apps/${{ matrix.app }}
          push: ${{ github.event_name != 'pull_request' }}
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            NODE_ENV=production
            NEXT_PUBLIC_APP_ENV=production
            NEXT_PUBLIC_APP_URL=https://${{ matrix.app }}.flowerhead.dev
            NEXT_PUBLIC_ANALYTICS_ENABLED=true
            NEXT_PUBLIC_ENABLE_DEBUG_MODE=false
            NEXT_PUBLIC_ENABLE_CONSOLE_LOGS=false
          secrets: |
            DATABASE_URL=${{secrets.DATABASE_URL}}
            DIRECT_URL=${{secrets.DIRECT_URL}}
            CLOUDINARY_API_KEY=${{secrets.CLOUDINARY_API_KEY}}
            CLOUDINARY_API_SECRET=${{secrets.CLOUDINARY_API_SECRET}}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}}
            CC_DATABASE_URL=postgresql://postgres:0e12a7216c73fd5f3a1b5c44f20c827c@chris-coombs-db-pgbouncer.database.svc.cluster.local:5432/postgres
            CC_DIRECT_URL=postgresql://postgres:0e12a7216c73fd5f3a1b5c44f20c827c@chris-coombs-db-pgbouncer.database.svc.cluster.local:5432/postgres
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.app }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.app }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.app }}:v1.0.${{ steps.version.outputs.version }}

          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      # TEMPORARILY DISABLED: Rate limiting issues with cosign installation
      # - name: Sign the published Docker image
      #   if: ${{ github.event_name != 'pull_request' }}
      #   env:
      #     # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
      #     TAGS: ${{ steps.meta.outputs.tags }}
      #     DIGEST: ${{ steps.build-and-push.outputs.digest }}
      #   # This step uses the identity token to provision an ephemeral certificate
      #   # against the sigstore community Fulcio instance.
      #   run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
