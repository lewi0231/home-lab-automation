apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - gotk-sync.yaml
  - development.yaml
  - production.yaml

patches:
  # Reduce resource limits for all Flux controllers
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
    target:
      kind: Deployment
      name: "(kustomize-controller|helm-controller|source-controller|notification-controller|image-reflector-controller|image-automation-controller)"

  # Increase GitRepository interval to reduce polling frequency
  - patch: |
      - op: replace
        path: /spec/interval
        value: 5m0s    # Change from 1m0s to 5m0s
    target:
      kind: GitRepository
      name: flux-system

  # Increase Kustomization interval to reduce reconciliation frequency
  - patch: |
      - op: replace
        path: /spec/interval
        value: 15m0s   # Change from 10m0s to 15m0s
    target:
      kind: Kustomization
      name: flux-system

  # Add concurrent limits to prevent resource spikes
  - patch: |
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --concurrent=3    # Limit concurrent reconciliations
    target:
      kind: Deployment
      name: "(kustomize-controller|helm-controller)"

  # Add requeue dependency to reduce unnecessary reconciliations
  - patch: |
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --requeue-dependency=30s    # Increase from default
    target:
      kind: Deployment
      name: "(kustomize-controller|helm-controller)"
