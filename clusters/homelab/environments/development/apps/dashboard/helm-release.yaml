apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: dashboard
  namespace: development
spec:
  interval: 1h
  chart:
    spec:
      chart: homepage
      version: ">=1.0.0"
      sourceRef:
        kind: HelmRepository
        name: dashboard
        namespace: development
      interval: 1h
  values:
    # Basic configuration
    image:
      repository: ghcr.io/gethomepage/homepage
      tag: latest

    # Service configuration
    service:
      main:
        ports:
          http:
            port: 3000
            targetPort: 3000

    # Disable built-in ingress since we're using IngressRoute
    ingress:
      main:
        enabled: false

    # Persistence for config - simplified to avoid mount conflicts
    persistence:
      config:
        enabled: true
        type: configMap
        name: homepage-config
        mountPath: /app/config

    # Resources
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

    # Service account for Kubernetes integration
    serviceAccount:
      create: false
      name: dashboard
