apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-blog-db
  namespace: development
  labels:
    app: personal-blog-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: personal-blog-db
  template:
    metadata:
      labels:
        app: personal-blog-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "personal_blog"
            - name: POSTGRES_USER
              value: "blog_user"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: personal-blog-db-secret
                  key: password
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: personal-blog-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: personal-blog-db
  namespace: development
  labels:
    app: personal-blog-db
spec:
  selector:
    app: personal-blog-db
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: personal-blog-db-pvc
  namespace: development
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Secret
metadata:
  name: personal-blog-db-secret
  namespace: development
type: Opaque
data:
  password: YmxvZ19wYXNzd29yZA== # "blog_password" in base64
