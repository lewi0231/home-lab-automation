apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: development
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: ""
  #settings.yaml: |
  #  providers:
  #    longhorn:
  #      url: https://longhorn.my.network
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/lewi0231
  services.yaml: |
    - Web Apps:
        - Personal Blog:
            href: https://personal-blog.development.flowerhead.dev/
            description: My staged blog in the cluster
        - Work Rate Calculator
            href: https://work-rate-calculator.development.flowerhead.dev
            description: My staged Work Rate Calculator
    - Monitoring:
        - Traefik-Private
            href: https://traefik-private.development.flowerhead.dev
            description: Traefik (Internal) Dashboard
    - Services:
        - Pi Hole
            href: https://pihole.flowerhead.dev/admin
            description: Pi Hole - which is my dns router.
        - Pfsense
            href: http://pfsense.flowerhead.dev
            description: My Router and DHCP server

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
