apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: development
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: HomeLab Dashboard
    theme: dark
    color: slate
    language: en
  #settings.yaml: |
  #  providers:
  #    longhorn:
  #      url: https://longhorn.my.network
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/lewi0231
        - Cloudflare:
            - abbr: CL
              href: https://cloudflare.com
    - Blogs:
        - Personal Blog:
            - abbr: FH
              href: https://blog.flowerhead.dev
              description: My Public Blog
        - Chris Coombs Blog:
            - abbr: CCB
              href: https://chriscoombs.flowerhead.dev
              description: Chris's blog

  services.yaml: |
    - Web Apps:
        - Work Rate Calculator:
            href: https://work-rate-calculator.flowerhead.dev
            description: Work Rate Calculator which is to be used for UniPhi
        - Home Assistant:
            href: http://http://10.30.30.81:8123/lovelace/default_view
            description: Home Assistant App
    - Monitoring:
        - Traefik-Private:
            href: https://traefik-private.flowerhead.dev
            description: Traefik (Internal) Dashboard
        - Traefik-Public:
            href: https://traefik-public.flowerhead.dev
            description: Traefik (External) Dashboard
        - Grafana Logs:
            href: https://grafana.flowerhead.dev
            description: Kubernetes System Logs
        - Grafana Metrics:
            href: https://grafana.flowerhead.dev
            description: Kubernetes Overview

    - Devices:
        - Pfsense:
            href: http://pfsense.flowerhead.dev
            description: My Router and DHCP server
        - Managed Switch:
            href: http://switch.flowerhead.dev
            description: TPLinkEAP Switch
        - Proxmox Server:
            href: http://proxmox.flowerhead.dev:8006
            description: This is my proxmox server.
        - Access Point:
            href: http://access-point.flowerhead.dev

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
  proxmox.yaml: ""
  unifi.yaml: ""
  traefik.yaml: ""
