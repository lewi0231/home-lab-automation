apiVersion: apps/v1
kind: Deployment
metadata:
  name: chris-coombs-blog
  namespace: production
spec:
  selector:
    matchLabels:
      app: chris-coombs-blog
  replicas: 1
  template:
    metadata:
      labels:
        app: chris-coombs-blog
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: chris-coombs-blog
          image: ghcr.io/lewi0231/home-lab-automation-chris-coombs-blog:latest # {"$imagepolicy": "production:chris-coombs-blog"}
          ports:
            - containerPort: 80
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chris-coombs-db-url
                  key: DATABASE_URL
            - name: DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: chris-coombs-db-url
                  key: DIRECT_URL
            - name: ADMIN_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: chris-coombs-admin
                  key: ADMIN_ACCESS_KEY
            - name: ADMIN_ENABLED
              valueFrom:
                secretKeyRef:
                  name: chris-coombs-admin
                  key: ADMIN_ENABLED
            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chris-coombs-cloudinary
                  key: CLOUDINARY_API_KEY
            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: chris-coombs-cloudinary
                  key: CLOUDINARY_API_SECRET
            - name: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: chris-coombs-cloudinary
                  key: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
---
apiVersion: v1
kind: Service
metadata:
  name: chris-coombs-blog
  namespace: production
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: chris-coombs-blog
