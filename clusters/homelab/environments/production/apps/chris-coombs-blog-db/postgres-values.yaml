# PostgreSQL values
postgresql:
  enabled: true
  auth:
    existingSecret: "chris-coombs-db-postgresql"
    existingSecretKeys:
      adminPasswordKey: "postgres-password"
      userPasswordKey: "postgres-password"
    # database: "postgres"
    # username: "lewi0231"

  primary:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: "local-path"

    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"

    securityContext:
      enabled: true
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999

    livenessProbe:
      enabled: true
      initialDelaySeconds: 20
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 6

    readinessProbe:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6
auth:
  enablePostgresUser: true
  postgresPassword: "postgres" # Set your desired password here
  adminPasswordKey: postgres-password
  userPasswordKey: postgres-password
