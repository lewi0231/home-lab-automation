apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-blog
  namespace: production
spec:
  selector:
    matchLabels:
      app: personal-blog
  replicas: 1
  template:
    metadata:
      labels:
        app: personal-blog
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: personal-blog
          image: ghcr.io/lewi0231/home-lab-automation-personal-blog:latest # {"$imagepolicy": "production:personal-blog"}
          ports:
            - containerPort: 80
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: personal-blog-db-url
                  key: DATABASE_URL
            - name: ADMIN_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: personal-blog-admin
                  key: ADMIN_ACCESS_KEY
            - name: ADMIN_ENABLED
              valueFrom:
                secretKeyRef:
                  name: personal-blog-admin
                  key: ADMIN_ENABLED
            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: personal-blog-cloudinary
                  key: CLOUDINARY_API_KEY
            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: personal-blog-cloudinary
                  key: CLOUDINARY_API_SECRET
            - name: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: personal-blog-cloudinary
                  key: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
---
apiVersion: v1
kind: Service
metadata:
  name: personal-blog
  namespace: production
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: personal-blog
