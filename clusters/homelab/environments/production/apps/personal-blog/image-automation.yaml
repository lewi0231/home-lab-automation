---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: personal-blog
  namespace: production
spec:
  image: ghcr.io/lewi0231/personal-blog
  interval: 1m0s
  secretRef:
    name: ghcr-credentials
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: personal-blog
  namespace: production
spec:
  imageRepositoryRef:
    name: personal-blog
  policy:
    # For SHA-based tags:
    # alphabetical:
    #   order: desc
    semver:
      range: ">=0.0.0"
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: personal-blog
  namespace: production
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: production
    namespace: production
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: "Update personal-blog image to latest version"
    push:
      branch: main
  update:
    path: ./clusters/homelab/environments/production/apps/personal-blog
    strategy: Setters
