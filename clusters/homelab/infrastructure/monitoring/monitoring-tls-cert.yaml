apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monitoring-tls
  namespace: monitoring
spec:
  secretName: monitoring-tls
  issuerRef:
    name: cluster-issuer-production
    kind: ClusterIssuer
  dnsNames:
    - traefik-private.flowerhead.dev
    - traefik-public.flowerhead.dev
    - grafana.flowerhead.dev
