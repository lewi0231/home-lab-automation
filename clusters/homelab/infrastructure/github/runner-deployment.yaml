apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerDeployment
metadata:
  name: chris-coombs-blog-runner
  namespace: actions
  annotations:
    # Prevent Karpenter from evicting these pods during scaling
    karpenter.sh/do-not-evict: "true"
spec:
  template:
    spec:
      # Repository-level runner for personal account
      repository: lewi0231/home-lab-automation

      # Labels that workflows will use to target these runners
      labels:
        - self-hosted
        - chris-coombs-blog
        - k3s-local

      # Use latest runner image (might be cached or more available)
      image: summerwind/actions-runner:latest

      # Reduced resource allocation to fit cluster capacity
      resources:
        requests:
          cpu: 500m # 0.5 CPU cores
          memory: 1Gi # 1GB RAM
        limits:
          cpu: 2000m # Allow bursting to 2 cores
          memory: 4Gi # Max 4GB RAM

      # Disable Docker for initial testing - we'll add it back once basic runner works
      dockerEnabled: false

      # Tolerations to allow scheduling on any node
      tolerations:
        - operator: Exists

      # Node affinity to prefer nodes with more resources
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: NotIn
                    values: ["t3.nano", "t3.micro"]
