apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerDeployment
metadata:
  name: chris-coombs-blog-runner
  namespace: actions
  annotations:
    # Prevent Karpenter from evicting these pods during scaling
    karpenter.sh/do-not-evict: "true"
spec:
  template:
    spec:
      # Repository-level runner for personal account
      repository: lewi0231/home-lab-automation

      # Labels that workflows will use to target these runners
      labels:
        - self-hosted
        - chris-coombs-blog
        - k3s-local

      # Use Node.js 18 compatible runner image for your blog builds
      image: summerwind/actions-runner:ubuntu-20.04

      # Resource allocation for Node.js builds + Docker
      resources:
        requests:
          cpu: 2000m # 2 CPU cores for Node.js builds
          memory: 4Gi # 4GB RAM for npm dependencies
        limits:
          cpu: 4000m # Allow bursting to 4 cores
          memory: 8Gi # Max 8GB RAM

      # Environment variables for the runner
      env:
        - name: DOCKER_HOST
          value: tcp://localhost:2376
        - name: DOCKER_TLS_VERIFY
          value: "1"
        - name: DOCKER_CERT_PATH
          value: /certs/client

      # Docker-in-Docker sidecar for building containers
      dockerdWithinRunnerContainer: false
      dockerEnabled: true

      # Volume mounts for Docker certificates
      volumeMounts:
        - name: docker-certs
          mountPath: /certs

      volumes:
        - name: docker-certs
          emptyDir: {}

      # Tolerations to allow scheduling on any node
      tolerations:
        - operator: Exists

      # Node affinity to prefer nodes with more resources
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: NotIn
                    values: ["t3.nano", "t3.micro"]
