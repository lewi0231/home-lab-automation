apiVersion: actions.summerwind.dev/v1alpha1
kind: HorizontalRunnerAutoscaler
metadata:
  name: chris-coombs-blog-runner-autoscaler
  namespace: actions
spec:
  # Scale between 0-1 runners for testing (adjust based on your needs)
  minReplicas: 0
  maxReplicas: 1

  # Target the runner deployment we just created
  scaleTargetRef:
    kind: RunnerDeployment
    name: chris-coombs-blog-runner

  # Scaling triggers - this will scale up when workflow jobs are queued
  scaleUpTriggers:
    - githubEvent:
        workflowJob: {}
      amount: 1
      duration: 30m # Keep runners alive for 30min after job completion

  # Scale down settings
  scaleDownDelaySecondsAfterScaleOut: 300 # Wait 5min before scaling down

  # Metrics for scaling decisions
  metrics:
    - type: TotalNumberOfQueuedAndInProgressWorkflowRuns
      repositoryNames:
        - home-lab-automation # Replace with your repository name
