globalArguments:
  - "--global.sendanonymoususage=false"
  - "--global.checknewversion=false"

additionalArguments:
  - "--serversTransport.insecureSkipverify=true"
  - "--log.level=DEBUG"
  - "--entryPoints.dns-tcp.address=:53"
  - "--entryPoints.dns-udp.address=:53/udp"

deployment:
  enabled: true
  replicas: 1
  annotations: {}
  podAnnotations: {}
  additionalContainers: []
  initContainers: []

ports:
  web:
    port: 80
    redirections:
      entryPoint:
        to: websecure
        scheme: https
        permanent: true
  websecure:
    port: 443
    tls:
      enabled: true
  dns-tcp:
    port: 53
    expose:
      default: true
    exposedPort: 53
    protocol: TCP
    reusePort: true
  dns-udp:
    port: 53
    expose:
      default: true
    exposedPort: 53
    protocol: UDP
    resusePort: true

ingressRoute:
  dashboard:
    enabled: false

providers:
  kubernetesCRD:
    enabled: true
    ingressClass: traefik-private
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: false

rbac:
  enabled: true

service:
  enabled: true
  type: LoadBalancer
  annotations:
    {}
    # metallb.io/ip-allocated-from-pool: first-pool
  labels: {}
  spec:
    loadBalancerIP: 10.60.60.65 # Must be within Metallb range
  loadBalancerSourceRanges: []
  externalIPs: []
