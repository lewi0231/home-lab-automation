# clusters/homelab/infrastructure/traefik/helm-release.yaml
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: traefik
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: traefik
      version: "24.0.0" # Specify version
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    ingressClass:
      enabled: true
      isDefaultClass: true
    service:
      annotations:
        metallb.universe.tf/address-pool: internal-pool
    rbac:
      enabled: true
