# clusters/homelab/infrastructure/traefik-dmz/helm-release.yaml
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: traefik-dmz
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: traefik
      version: "24.0.0" # Specify version
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    deployment:
      kind: Deployment
      replicas: 1
      nodeSelector:
        network: dmz
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik-dmz
    service:
      annotations:
        metallb.universe.tf/address-pool: dmz-pool
    rbac:
      enabled: true
    providers:
      kubernetesCRD:
        enabled: true
        namespaces: ["production"]
      kubernetesIngress:
        enabled: true
        namespaces: ["production"]
        ingressClass: traefik-dmz
