---
- name: Install Cert Manager using k8s module
  hosts: localhost
  tasks:
    - name: Install cert-manager via kubectl
      shell: |
        kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.17.2/cert-manager.yaml
    - name: Wait for cert-manager pods
      shell: |
        kubectl wait --for=condition=ready pod -l app.kubernetes.io/instance=cert-manager -n cert-manager --timeout=300s

- name: Deploy Rancher
  hosts: localhost
  environment:
    KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"
  vars_files:
    - ../group_vars/k3s_cluster.yaml
  tasks:
    - name: Ensure Helm is installed
      command: helm version
      register: helm_check
      failed_when: helm_check.rc != 0
      changed_when: false

    - name: Add Rancher Helm repository
      kubernetes.core.helm_repository:
        name: rancher-stable
        repo_url: https://releases.rancher.com/server-charts/stable

    - name: Update Helm repositories
      command: helm repo update

    - name: Create cattle-system namespace
      k8s:
        api_version: v1
        kind: Namespace
        name: cattle-system
        state: present

    - name: Install Rancher with helm
      kubernetes.core.helm:
        name: rancher
        # chart: rancher-stable/rancher
        chart_ref: rancher-stable/rancher
        release_namespace: cattle-system
        # namespace: cattle-system
        values:
          hostname: "{{ RANCHER_HOSTNAME }}"
          bootstrapPassword: admin

    - name: Wait for Rancher pods
      shell: |
        kubectl wait --for=condition=ready pod --all -n cattle-system --timeout=300s

    - name: Expose Rancher via LoadBalancer Service
      command: kubectl expose deployment rancher --name rancher-lb --port=443 --type=LoadBalancer -n cattle-system
